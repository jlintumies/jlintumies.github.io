<text x="20.0" y="39.00" font-family="Bitstream Charter" font-size="3.48" font-weight="bold" fill="#16232F">Marraskuun ensimmäisenä iltana 2027 Viinijärven yllä kulkee kone,</text>
<text x="20.0" y="43.94" font-family="Bitstream Charter" font-size="3.48" font-weight="bold" fill="#16232F">jossa ei pala valoja.</text>
<text x="20.0" y="51.84" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">Jokainen kone vilkuttaa. Se on laki, ja se on turvallisuutta. Tämä kulkee</text>
<text x="20.0" y="56.49" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">suoraan ja tasaisesti kuin jokin, joka tietää minne on menossa eikä halua</text>
<text x="20.0" y="61.13" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">että siinä häiritään.</text>
<text x="20.0" y="68.56" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">Pihalla seisoo mies, joka on ollut viisi viikkoa eläkkeellä ja kirjannut</text>
<text x="20.0" y="73.20" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">vihkoon mitä taivaalla kulkee: aika, suunta, vanojen määrä. Kaksikymmentä</text>
<text x="20.0" y="77.85" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">kilometriä pohjoisempana seitsemäntoistavuotias seuraa samoja koneita</text>
<text x="20.0" y="82.49" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">katolle viritetyllä antennilla ja huomaa, että ne katoavat kartalta aina</text>
<text x="20.0" y="87.14" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">samassa kohdassa. Ja lintutornissa istuu vanha ystävä, jolla on</text>
<text x="20.0" y="91.78" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">samanlainen vihko — liian siisti.</text>
<text x="20.0" y="99.21" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">Kukaan ei pyydä heitä katsomaan. Kukaan ei usko heitä ajoissa.</text>
<text x="20.0" y="106.63" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">Majakkaraja on kirja ihmisistä, joilla ei ole virkaa eikä valtuuksia —</text>
<text x="20.0" y="111.28" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">vain vihko, kylän baari ja tapa katsoa ylös. Se on hidas kirja, ja se on</text>
<text x="20.0" y="115.92" font-family="Bitstream Charter" font-size="3.27" font-weight="normal" fill="#16232F">hidas tarkoituksella, koska niin tämä asia tapahtuu.</text>
